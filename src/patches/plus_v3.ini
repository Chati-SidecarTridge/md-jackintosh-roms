# src/patches/plus_v3.ini: the patches tools/jackrom.py applies to the Mac Plus
# v3 ROM (EPIC-01 STORY-05). One section per patch:
#
#   offset  the offset into the 128 KB Mac ROM (even)
#   length  the bytes replaced (even); the replacement has exactly this length
#           (D-08: the ROM keeps every byte offset)
#   sha256  the SHA-256 of the original bytes, never the bytes (D-02);
#           tools/jackrom.py hash --offset N --length N prints it
#   replace nop | jmp SYMBOL | jsr SYMBOL (padded with NOPs) | long VALUE |
#           word VALUE | bytes HEX
#           VALUE: a glue symbol from GLUE.MAP, rom+OFFSET (that Mac ROM
#           offset in this image), or a number
#   source  the mac_rom file:line of the original
#   reason  why
#   enabled yes | no (a planned patch is entered disabled until its story
#           implements it)
#
# The merge refuses a ROM whose bytes differ from an enabled patch's hash, and
# overlapping enabled patches.

[mac-reset-vector]
offset = 0x0004
length = 4
sha256 = 3a40aa1385946ea442be38d27b1944238786c3306261c354d480e87467e89317
replace = long glueReset
source = plus/boot/vectors.s:53
reason = The Mac ROM's reset PC is EBootStart at $40002A, which does not exist
  on an Atari. Anything that restarts through it gets the glue's reset instead.
  First patch of the mechanism (EPIC-01 STORY-05).
enabled = yes

# atari-conflicts.md 3.2 names the entry BRAs at ROMBase+$0A/$0E. A BRA.W cannot be
# retargeted to the glue by a fixed value, so the +$0A path is caught at COLD_START
# (whose only other callers are on the cold path). +$0E (BRA DISK_NOT_BOOTABLE,
# vectors.s:60) has no same-length fix: its target is inside the boot loop.
[boot-cold-start]
offset = 0x00062
length = 8
sha256 = 53b8a32d844c67524a4ce36c3dbb1cb874736978d1635aa6682db17b2242648d
replace = jmp glueReset
source = plus/boot/vectors.s:128-129
reason = System restart (DSAT, Finder) does RESET and JMP ROMBase+$0A into COLD_START, which
  reads $F00000 (bus error). atari-conflicts.md 3.2 (restart): send it to the glue.
enabled = yes

# Alternative (atari-conflicts.md 3.2): retarget only the SERegs operand of this MOVEM
# (vectors.s:273) like the syserr-seregs-* entries. The JMP covers it, so there is no
# separate entry. boot-map.md A9 says CritErr is reached only from the skipped cold
# path.
[syserr-criterr]
offset = 0x00136
length = 8
sha256 = aeea93e910c1a1a906a8477c447854e4fe70a18b880b08136e6f6eb05607bb3d
replace = jmp glueCritErr
source = plus/boot/vectors.s:273
reason = CritErr saves to SERegs $3FFC80, touches the IWM and draws the sad Mac at absolute
  512x342 addresses. atari-conflicts.md 3.2, 5.4; boot-map.md A9, 8.9.
enabled = no

[rtc-clknomem]
offset = 0x001F8
length = 10
sha256 = b4790df5569dbbd0adba29876bc7b66cd82e28d69e62124e78fae57b57dae12a
replace = jmp glueClkNoMem
source = plus/boot/vectors.s:375-377
reason = ClkNoMem bit-bangs the RTC on VIA port B ($EFE1FE). boot-map.md P5/C3,
  hardware-use.md 2.5: replace with a RAM PRAM + clock emulation (D1 cmd, D2 data, JMP (A5)).
enabled = yes

# Alternative (hardware-use.md 5.3): patch SysBeep itself (debugger.s:310) or its
# BRA BootBeep (debugger.s:334). SysBeep ($011DC) is a ptch 3 call target, so the
# BootBeep head is the less intrusive site.
[sound-bootbeep]
offset = 0x0028A
length = 6
sha256 = 90c1ba63819751a69d03c72bb207d622dc53d5951dd05f35797cb05e39c1e8a0
replace = jmp glueBootBeep
source = plus/boot/vectors.s:491-492
reason = BootBeep polls the VIA at $EFE1FE and writes the sound buffer $3FFD00; reached from
  _SysBeep. hardware-use.md 5.3, 1.2; atari-conflicts.md 3.2 (D3 = ticks, return JMP (A6)).
enabled = yes

[boot-diag-rom-f80080]
offset = 0x0036C
length = 4
sha256 = 091c7f4042129ac24da3ebe9e95c71637f25d41dd258b96647a920447c4bce9e
replace = long rom+0
source = plus/boot/vectors.s:629
reason = Diagnostic-ROM probe reads $F80080 (bus error on an ST). atari-conflicts.md 3.2;
  boot-map.md B3 (only reached if the glue enters at BootPart2). rom+0 is not $55AAAA55.
enabled = no

# atari-conflicts.md 5.3 asks for the SUBA immediate $5900 -> $8100, but the SUBA is
# .W (4 bytes) and $8100 sign-extends, which boot-map.md B4 points out. LEA from A1
# gives the same result in the same 4 bytes. Only reached if the glue enters at
# BootPart2 (boot-map.md section 6 recommends E_SoftReset, where the glue sets BufPtr).
[boot-bufptr-screen]
offset = 0x003A0
length = 4
sha256 = c6b00d696446a77b27cd4b5ce903041439b0e65ef49f66f1455c8cfe3c2acc9a
replace = bytes 4BE98200
source = plus/boot/vectors.s:654
reason = BufPtr = ScrnBase = MemTop - $8100 for the 640x400 screen (atari-conflicts.md 5.3).
  Replacement: LEA -$7E00(A1),A5 (A1 = MemTop - $300 from vectors.s:652).
enabled = no

[boot-rombase]
offset = 0x003B4
length = 4
sha256 = c9a41c78ed4170c1826be3b5da55e87f4ba32107a5595dd34baeb0cba2570eb1
replace = long rom+0
source = plus/boot/vectors.s:662
reason = ROMBase = $400000; ours is $FD0000 (st) or $E20000 (ste). boot-map.md P1/B5;
  atari-conflicts.md 3.2. rom+0 resolves per machine at merge time.
enabled = yes

# Both operands read the same long, so the probe takes its BEQ; boot-scsi-branch
# and boot-hwcfg-xpram below then set HWCfgFlags to $40 (XPRAM, no SCSI)
# (boot-map.md B6, EPIC-08 STORY-03).
[boot-scsi-probe-a]
offset = 0x003E6
length = 4
sha256 = 3d89bbb8c7e850709899a8651b5cd4764d1b6bcabdd564114fbfcc6ddcf0f81b
replace = long rom+0
source = plus/boot/vectors.s:679
reason = SCSI/mirror probe reads $420000 (bus error). boot-map.md P2/B6 option (a): both
  operands read the same long, so HWCfgFlags stays 0 (no SCSI, no XPRAM).
enabled = yes

[boot-scsi-probe-b]
offset = 0x003EC
length = 4
sha256 = 5fb603498c7ec93e121465ce89d4e0bb75fe4dd227e4e87a4e2de6b7e7a368a1
replace = long rom+0
source = plus/boot/vectors.s:680
reason = Second operand of the SCSI/mirror probe ($440000). boot-map.md P2/B6 option (a);
  atari-conflicts.md 3.2 (HWCfgFlags = 0).
enabled = yes

[boot-scsi-branch]
offset = 0x003F0
length = 2
sha256 = c6988a6881f0312aed6878fe6f40767807d62e1a004432bc4cdb19c302ed47ff
replace = nop
source = plus/boot/vectors.s:681
reason = The probe's BEQ past the HWCfgFlags store: always store it, with the value
  boot-hwcfg-xpram gives (EPIC-08 STORY-03).
enabled = yes

[boot-hwcfg-xpram]
offset = 0x003F4
length = 2
sha256 = 81c2a21c99c2e261ad6d91443ffb383b57c321d7e33f09cb64c8b946bb14939b
replace = word 0x0040
source = plus/boot/vectors.s:682
reason = HWCfgFlags $C0 (SCSI and XPRAM) becomes $40: XPRAM only, so _ReadXPRam and
  _WriteXPRam reach the glue's 256-byte PRAM (glueRtc) instead of failing with
  prWrErr, and nothing believes a SCSI chip is there. EPIC-08 STORY-03.
enabled = yes

[boot-via-base]
offset = 0x003FE
length = 4
sha256 = 170abdb5ab752d74a7eb24a0d06cc47dfcdaaf1b50bc0b3c1563d6174d6ca942
replace = long glueViaShadow
source = plus/boot/vectors.s:687
reason = VIA global -> the glue RAM shadow VIA. boot-map.md P3/B7; hardware-use.md 1.1, 1.3;
  atari-conflicts.md 6.3 places it at $1400.
enabled = yes

