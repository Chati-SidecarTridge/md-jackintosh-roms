# ---------------------------------------------------------------------------
# Glue routines these patches need (none exists yet; tools/jackrom.py resolves
# symbols only for enabled patches). Routines keep the Mac register conventions
# (CLAUDE.md): they save what they touch beyond what the replaced code clobbered.
#
#   glueReset            (exists) also the restart target: System's RESET then
#                        JMP ROMBase+$0A lands here; redo the whole Atari bring-up.
#   glueCritErr          fatal boot error (sad Mac): save registers in glueSERegs,
#                        draw the code relative to ScrnBase/ScreenRow, halt.
#   glueClkNoMem         RTC/PRAM emulation over a 256-byte PRAM image and a seconds
#                        counter: command in D1, data in/out D2, return JMP (A5),
#                        A1/D3-D6 scratch; valid PRAM ($A8) from the start.
#   glueBootBeep         system beep (YM2149 on the ST, DMA sound on the STE) for D3
#                        ticks, return JMP (A6); never touches $3FFD00.
#   gluePlotDisk         hide the cursor, wait for Ticks to change, draw the disk icon
#                        with the symbol in D7 (0 = erase) centred on ScrnBase with
#                        ScreenRow, show the cursor, RTS.
#   glueShowHappyMac     draw the happy Mac centred on ScrnBase, return JMP (A5).
#   glueSonyOpen         install and open the glue .Sony DRVR as unit 4 (refNum -5),
#                        _AddDrive its drives (Sony flag bytes before each DQE);
#                        A0 = the boot's parameter block, D0 = result.
#   glueScsiHook         the InitIOMgr hook (boot-map.md C11.4): clear SCSIDrvrs,
#                        re-install the MFP vectors at $C0-$FC, own $60/$68/$70,
#                        start the 60.15 Hz tick, preserve all registers, RTS.
#   glueScsiDispatch     _SCSIDispatch stub: pop the selector and its parameters,
#                        return scCommErr (2).
#   glueScsiPrologue     SCSI_PROLOGUE replacement for direct callers (PTCH 117):
#                        unwind to the selector's caller and return scCommErr.
#   glueTimeRemainingMs  for _PrimeTime: D1.W = what is left of the programmed Time
#                        Manager interval in ms (MFP Timer B), A1 scratch, RTS.
#   glueTimeProgramT2    PROGRAM_T2 on MFP Timer B: D1 = soonest TMTask or nil, clamp
#                        to what the timer can do, store the interval at TimeVars+0,
#                        install VIAInt5_Timer2 in Lvl1DT[5], RTS.
#
# Glue data the patches point at (absolute symbols, defined by the linker script):
#
#   glueViaShadow        RAM shadow VIA = port B (registers at +n*$200, span $1E01;
#                        atari-conflicts.md 6.3 places it at $1400); bit 3 of port B
#                        is the mouse button, 1 = up.
#   glueViaShadowPortA   glueViaShadow + $1E00 (vBufA).
#   glueIwmShadow        RAM shadow IWM (span $1E01).
#   glueSccRdShadow      RAM shadow SCC read base (channel B control, 8 bytes).
#   glueSccWrShadow      RAM shadow SCC write base (odd address, 8 bytes).
#   glueSccRdShadowA     glueSccRdShadow + 2 (channel A control).
#   glueSccWrShadowA     glueSccWrShadow + 2 (channel A control).
#   glueSccWrDelta       glueSccWrShadow - glueSccRdShadow (a number, not an address).
#   glueSERegs           128-byte replacement for SERegs ($3FFC80) at a fixed address
#                        in the glue block; glueSERegsNN = glueSERegs + $NN for NN in
#                        20 3C 40 44 4A 4C 50 54 5A 5E 60 76 78 7C.
#
# ---------------------------------------------------------------------------
# Planned work that is not a ROM patch
#
#   - Relocate System 6.0.8's absolute $40xxxx ROM addresses (PTCH 117: 295, ptch 3:
#     1, CACH 1: 2) by ROMBase - $400000 at load time through jCheckLoad ($7F0),
#     keyed by SHA-256 (system6-offsets.md, Options A/A'). The doc also allows a
#     patch in CheckLoad itself but does not specify one. PTCH 117's hardware
#     absolutes ($F80078, $3FFC80, $9FFFFA/$BFFFFB) belong to the same table
#     (system6-offsets.md open question 4).
#   - Replace .Sony with a glue DRVR (unit 4, refNum -5) over the RAM-disk or
#     cartridge backend: Prime via JIODone, Control 7/9, Status 8, diskEvt
#     (hardware-use.md 5.1; boot-map.md 5.4). Keep ptch 7/8's .Sony offsets harmless
#     (system6-offsets.md open question 3).
#   - Glue entry point: E_SoftReset (boot-map.md 6) or BootPart2 (atari-conflicts.md
#     6.3). With E_SoftReset the glue does the $FF fill, SysErrInit and
#     INIT_MEMORY_MAP itself (boot-map.md 6, B1, B2, B4); with BootPart2 the fill
#     must spare the glue block $1400-$53FF (atari-conflicts.md 6.3).
#   - MFP: VR = $30 with automatic EOI before any IERA/IERB bit; vectors $60, $68
#     (HBL: ORI #$0200 to the stacked SR), $70 and $C0-$FC installed after
#     SysErrInit and before vectors.s:973 (atari-conflicts.md 1.3-1.6, 2.3).
#   - Mac level-1 work from the MFP gated on the stacked IPL (0 or 2), one
#     Lvl1DT[1] call per tick with A1 = glueViaShadow (atari-conflicts.md 2.4;
#     hardware-use.md 2.1-2.2).
#   - Timer C at prescaler 200 / data 204 for Ticks, 1 Hz Lvl1DT[0] from a
#     fractional accumulator, Timer B for the Time Manager (atari-conflicts.md 4).
#   - IKBD keyboard into the shadow vSR and Lvl1DT[2], KbdVers kept alive every 32
#     ticks; IKBD mouse into MTemp/CrsrNew and shadow port B bit 3
#     (hardware-use.md 3.2, 4.4).
#   - RAM sizing with the ST MMU; MemTop below the test RAM disk; screen at
#     MemTop - $8100 on a 256-byte boundary (atari-conflicts.md 5.3, 6.3).
#   - PortAUse/PortBUse bit 7 clear so SERD and .MPP opens fail with -97
#     (hardware-use.md 3.3, 3.4, open question 7).
#   - Low-memory byte $B73 bit 0, or PTCH 0 stops with SysError 103
#     (system6-offsets.md open question 1).
#   - Debug builds: wrap the bus-error vector $08 to trace, then chain to the Mac's
#     handler (atari-conflicts.md 3.3).
#   - Restart through ROMBase+$0E (BRA DISK_NOT_BOOTABLE): no same-length patch
#     (atari-conflicts.md 3.2, open question 5).
#   - Optional alternatives to ROM patches: the cursor routines through the $800
#     jump vectors, _ScrnBitMap/JScrnSize overrides (boot-map.md 7, C14), and the
#     _SCSIDispatch stub in the RAM trap slot (hardware-use.md 5.2).

