name: Pages

# Publishes site/ to GitHub Pages (jackintosh.sidecartridge.com) as static
# HTML (no Jekyll), on every push to main that changes the site, or by hand.
# The repository's Pages source is "GitHub Actions" (EPIC-11 STORY-01).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build the site
      working-directory: site
      run: node build.mjs
    - name: Collect what is published
      run: |
        mkdir -p _site
        cp site/index.html site/CNAME site/.nojekyll _site/
        if [ -d site/assets ]; then cp -R site/assets _site/; fi
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - id: deployment
      uses: actions/deploy-pages@v4
